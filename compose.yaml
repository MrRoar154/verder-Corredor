services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: verdecorredor
      POSTGRES_PASSWORD: verdecorredor
      POSTGRES_DB: verdecorredor
    ports:
      - "54329:5432"
    volumes:
      - verdecorredor_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdecorredor -d verdecorredor"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  verdecorredor_pg:
